# Synthetic teaching profile. No value below is a measured L4R5 timing parameter.
[model]
version=1
clock_hz=100000000
inclusion=inclusive
access=read_only
prefetch=none
cache_concurrency=blocking

[cache.L1]
replacement=lru
line_bytes=16
sets=2
ways=2
lookup_cycles=1
fill_cycles=1
initial_lines=empty
provenance=synthetic teaching geometry and timing

[cache.L2]
replacement=lru
line_bytes=32
sets=2
ways=2
lookup_cycles=3
fill_cycles=2
initial_lines=empty
provenance=synthetic teaching geometry and timing

[memory]
policy=fifo
first_beat_cycles=12
beat_bytes=8
beat_cycles=2
issue_cycles=2
outstanding=4
provenance=synthetic pipelined beat service; not STM32 flash

[stimulus]
entry=L1
mode=closed_loop
engine=stable_blocks
count=1000000000
address=0x08010000
bytes=4
stride=16
address_period=4
arrival_cycles=0
spacing_cycles=0
max_requests=10000
max_transactions=100000
