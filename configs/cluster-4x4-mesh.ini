# Synthetic 4x4 tiled CMP on a mesh (docs/cluster-design.md); memory controller at
# corner tile 0, so hop distance to it ranges 0..6. Core c_i streams 64 L2 lines from
# 0x1000*i: each (bank, set) receives lines from exactly 4 cores, filling its 4 ways,
# so after the cold pass every read hits in L2 and contention is at banks and links.
# No value below is a measured hardware parameter; the L4R5 board is single-core.
[model]
version=2
clock_hz=1000000000
access=read_only
prefetch=none
cache_concurrency=blocking
coherence=none

[topology]
kind=mesh
k=4
mc_tile=0
router_cycles=1
link_cycles=1
flit_bytes=16
link_arbitration=round_robin
provenance=synthetic teaching network

[l1]
line_bytes=32
sets=4
ways=2
lookup_cycles=1
fill_cycles=1
initial_lines=empty
provenance=synthetic

[l2]
line_bytes=64
sets=16
ways=4
lookup_cycles=4
fill_cycles=2
bank_arbitration=round_robin
initial_lines=empty
provenance=synthetic

[memory]
policy=fifo
first_beat_cycles=40
beat_bytes=16
beat_cycles=2
issue_cycles=2
outstanding=4
provenance=synthetic

[core.c0]
tile=0
start_cycles=0
compute_cycles=10
count=1000
address=0x0
bytes=4
stride=64
address_period=64

