# Synthetic 3x3 tiled CMP on a torus (docs/cluster-design.md); memory controller
# at the centre tile. Core c_i streams 32 L2 lines from 0x1000*i, so after the cold
# pass its working set stays resident (9 banks hold 576 lines).
# No value below is a measured hardware parameter; the L4R5 board is single-core.
[model]
version=2
clock_hz=1000000000
access=read_only
prefetch=none
cache_concurrency=blocking
coherence=none

[topology]
kind=torus
k=3
mc_tile=4
router_cycles=1
link_cycles=1
flit_bytes=16
link_arbitration=round_robin
provenance=synthetic teaching network

[l1]
line_bytes=32
sets=4
ways=2
lookup_cycles=1
fill_cycles=1
initial_lines=empty
provenance=synthetic

[l2]
line_bytes=64
sets=16
ways=4
lookup_cycles=4
fill_cycles=2
bank_arbitration=round_robin
initial_lines=empty
provenance=synthetic

[memory]
policy=fifo
first_beat_cycles=40
beat_bytes=16
beat_cycles=2
issue_cycles=2
outstanding=4
provenance=synthetic

[core.c0]
tile=0
start_cycles=0
compute_cycles=10
count=1000
address=0x0
bytes=4
stride=64
address_period=32

[core.c1]
tile=1
start_cycles=0
compute_cycles=10
count=1000
address=0x1000
bytes=4
stride=64
address_period=32

[core.c2]
tile=2
start_cycles=0
compute_cycles=10
count=1000
address=0x2000
bytes=4
stride=64
address_period=32

[core.c3]
tile=3
start_cycles=0
compute_cycles=10
count=1000
address=0x3000
bytes=4
stride=64
address_period=32

[core.c4]
tile=4
start_cycles=0
compute_cycles=10
count=1000
address=0x4000
bytes=4
stride=64
address_period=32

[core.c5]
tile=5
start_cycles=0
compute_cycles=10
count=1000
address=0x5000
bytes=4
stride=64
address_period=32

[core.c6]
tile=6
start_cycles=0
compute_cycles=10
count=1000
address=0x6000
bytes=4
stride=64
address_period=32

[core.c7]
tile=7
start_cycles=0
compute_cycles=10
count=1000
address=0x7000
bytes=4
stride=64
address_period=32

[core.c8]
tile=8
start_cycles=0
compute_cycles=10
count=1000
address=0x8000
bytes=4
stride=64
address_period=32

[stimulus]
# finite evaluates every read; periodic_state (fast-forward) is not implemented yet.
engine=finite
max_requests=100000
max_transactions=1000000
max_events=10000000
