# Saturated direct-memory reads. Queueing latency grows with the offered backlog.
[model]
version=1
clock_hz=100000000
inclusion=noninclusive
access=read_only
prefetch=none
cache_concurrency=blocking
[memory]
policy=fifo
first_beat_cycles=12
beat_bytes=8
beat_cycles=2
issue_cycles=2
outstanding=4
provenance=synthetic pipelined beat service; not STM32 flash
[stimulus]
entry=memory
mode=open_loop
engine=periodic
count=1000000000
address=0
bytes=32
stride=0
address_period=1
arrival_cycles=0
spacing_cycles=0
max_requests=10000
max_transactions=100000
