<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1310" viewBox="0 0 1440 1310" role="img" aria-labelledby="title desc">
<title id="title">Read the timing boundaries correctly</title><desc id="desc">Synthetic 32-byte reads: D=18 cycles, I=8 cycles, 100 MHz clock. Implementation study diagram; exact only under the stated synthetic model.</desc>
<defs><marker id="a2465a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2465a8"/></marker><marker id="a137866" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#137866"/></marker><marker id="aa75616" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a75616"/></marker><marker id="a7151a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7151a1"/></marker><marker id="a142b43" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#142b43"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Consolas,monospace}</style>
<rect width="1440" height="1310" fill="#fbfcfe"/>
<rect width="1440" height="144" fill="#142b43"/>
<text x="48" y="38" font-size="15" fill="#a5d8f5" font-weight="700">EDGE-ML  /  IMPLEMENTATION ATLAS  /  05</text>
<text x="48" y="82" font-size="34" fill="#ffffff" font-weight="700">Read the timing boundaries correctly</text>
<text x="48" y="117" font-size="19" fill="#d5e4f1" font-weight="400">Synthetic 32-byte reads: D=18 cycles, I=8 cycles, 100 MHz clock</text>
<text x="48" y="191" font-size="25" fill="#142b43" font-weight="700">A  Direct memory: four requests offered together at tick 0</text>
<text x="48" y="222" font-size="20" fill="#51657a" font-weight="400">K=4 credits: starts at 0, 8, 16, 24; completes at 18, 26, 34, 42.</text>
<path d="M245 260 V 493" stroke="#dbe3ec"/>
<text x="238" y="254" font-size="16" fill="#51657a" font-weight="400">0</text>
<path d="M341 260 V 493" stroke="#dbe3ec"/>
<text x="334" y="254" font-size="16" fill="#51657a" font-weight="400">4</text>
<path d="M437 260 V 493" stroke="#dbe3ec"/>
<text x="430" y="254" font-size="16" fill="#51657a" font-weight="400">8</text>
<path d="M533 260 V 493" stroke="#dbe3ec"/>
<text x="526" y="254" font-size="16" fill="#51657a" font-weight="400">12</text>
<path d="M629 260 V 493" stroke="#dbe3ec"/>
<text x="622" y="254" font-size="16" fill="#51657a" font-weight="400">16</text>
<path d="M725 260 V 493" stroke="#dbe3ec"/>
<text x="718" y="254" font-size="16" fill="#51657a" font-weight="400">20</text>
<path d="M821 260 V 493" stroke="#dbe3ec"/>
<text x="814" y="254" font-size="16" fill="#51657a" font-weight="400">24</text>
<path d="M917 260 V 493" stroke="#dbe3ec"/>
<text x="910" y="254" font-size="16" fill="#51657a" font-weight="400">28</text>
<path d="M1013 260 V 493" stroke="#dbe3ec"/>
<text x="1006" y="254" font-size="16" fill="#51657a" font-weight="400">32</text>
<path d="M1109 260 V 493" stroke="#dbe3ec"/>
<text x="1102" y="254" font-size="16" fill="#51657a" font-weight="400">36</text>
<path d="M1205 260 V 493" stroke="#dbe3ec"/>
<text x="1198" y="254" font-size="16" fill="#51657a" font-weight="400">40</text>
<path d="M1301 260 V 493" stroke="#dbe3ec"/>
<text x="1294" y="254" font-size="16" fill="#51657a" font-weight="400">44</text>
<text x="48" y="306" font-size="20" fill="#142b43" font-weight="400">Request 0</text>
<rect x="245" y="282" width="432" height="31" rx="4" fill="#2465a8"/>
<text x="255" y="303.5" font-size="18" fill="#ffffff" font-weight="700">0 → 18</text>
<circle cx="533" cy="297" r="5" fill="#f0c36a"/>
<circle cx="581" cy="297" r="5" fill="#f0c36a"/>
<circle cx="629" cy="297" r="5" fill="#f0c36a"/>
<circle cx="677" cy="297" r="5" fill="#f0c36a"/>
<text x="48" y="357" font-size="20" fill="#142b43" font-weight="400">Request 1</text>
<rect x="437" y="333" width="432" height="31" rx="4" fill="#2465a8"/>
<text x="447" y="354.5" font-size="18" fill="#ffffff" font-weight="700">8 → 26</text>
<circle cx="725" cy="348" r="5" fill="#f0c36a"/>
<circle cx="773" cy="348" r="5" fill="#f0c36a"/>
<circle cx="821" cy="348" r="5" fill="#f0c36a"/>
<circle cx="869" cy="348" r="5" fill="#f0c36a"/>
<text x="48" y="408" font-size="20" fill="#142b43" font-weight="400">Request 2</text>
<rect x="629" y="384" width="432" height="31" rx="4" fill="#2465a8"/>
<text x="639" y="405.5" font-size="18" fill="#ffffff" font-weight="700">16 → 34</text>
<circle cx="917" cy="399" r="5" fill="#f0c36a"/>
<circle cx="965" cy="399" r="5" fill="#f0c36a"/>
<circle cx="1013" cy="399" r="5" fill="#f0c36a"/>
<circle cx="1061" cy="399" r="5" fill="#f0c36a"/>
<text x="48" y="459" font-size="20" fill="#142b43" font-weight="400">Request 3</text>
<rect x="821" y="435" width="432" height="31" rx="4" fill="#2465a8"/>
<text x="831" y="456.5" font-size="18" fill="#ffffff" font-weight="700">24 → 42</text>
<circle cx="1109" cy="450" r="5" fill="#f0c36a"/>
<circle cx="1157" cy="450" r="5" fill="#f0c36a"/>
<circle cx="1205" cy="450" r="5" fill="#f0c36a"/>
<circle cx="1253" cy="450" r="5" fill="#f0c36a"/>
<text x="245" y="524" font-size="19" fill="#51657a" font-weight="400">Blue bar = in-flight interval. Gold dots = beat completions. Axis unit = cycles.</text>
<text x="48" y="582" font-size="25" fill="#142b43" font-weight="700">B  One credit: later requests cannot start until the prior one completes</text>
<text x="48" y="620" font-size="21" fill="#142b43" font-weight="400">K=1 → starts 0, 18, 36, 54; last completion 72 cycles for four requests.</text>
<text x="48" y="654" font-size="21" fill="#142b43" font-weight="400">Idle-spaced requests → each has 18-cycle latency, with no queueing.</text>
<text x="48" y="688" font-size="21" fill="#142b43" font-weight="400">Saturated K=4 → asymptotic useful rate = 32 bytes / 8 cycles = 400 MB/s at 100 MHz.</text>
<path d="M 48 733 H 1392" stroke="#d4dfe9"/>
<text x="48" y="780" font-size="25" fill="#142b43" font-weight="700">C  A cold L1 miss: serial lookup, memory and installation costs</text>
<text x="48" y="816" font-size="20" fill="#51657a" font-weight="400">The cache example follows configs/hierarchy.ini; the request is 4 bytes, but memory fills 32 bytes.</text>
<rect x="48" y="850" width="50.76" height="53" rx="4" fill="#2465a8"/>
<rect x="101.75999999999999" y="850" width="158.28" height="53" rx="4" fill="#7151a1"/>
<rect x="263.03999999999996" y="850" width="964.68" height="53" rx="4" fill="#137866"/>
<rect x="1230.7199999999998" y="850" width="104.52" height="53" rx="4" fill="#a75616"/>
<rect x="1338.2399999999998" y="850" width="50.76" height="53" rx="4" fill="#2465a8"/>
<text x="48" y="940" font-size="22" fill="#142b43" font-weight="400">L1 lookup 1  +  L2 lookup 3  +  memory 18  +  L2 fill 2  +  L1 fill 1  =  25 cycles</text>
<text x="48" y="979" font-size="22" fill="#142b43" font-weight="400">L1 hit = 1 cycle. L2 hit with L1 miss = 1 + 3 + 1 = 5 cycles.</text>
<text x="48" y="1018" font-size="22" fill="#142b43" font-weight="400">Finite bandwidth uses total useful bytes / (last completion − first offered arrival).</text>
<text x="48" y="1057" font-size="22" fill="#142b43" font-weight="400">It includes startup and drain; growing queueing delay is not steady-state latency.</text>
<path d="M 48 1233 H 1392" stroke="#d4dfe9"/>
<text x="48" y="1262" font-size="17" fill="#51657a" font-weight="400">SCOPE  Synthetic read-only model • one clock • no board-accuracy claim</text>
<text x="48" y="1288" font-size="16" fill="#51657a" font-weight="400">CODE  configs/hierarchy.ini • configs/memory-latency.ini • configs/memory-bandwidth.ini • tests/hierarchy_tests.cpp</text>
</svg>